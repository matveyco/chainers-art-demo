# Host nginx vhost for chainers.art (installed as /etc/nginx/sites-available/chainers-art).
# Enabled through the symlink sites-enabled/zz-chainers-art: the "zz-" prefix makes it load after
# the other sites, so it never becomes the implicit default server for port 443.
# Cloudflare (proxied) -> this vhost (TLS) -> container on 127.0.0.1:4190.

server {
    listen 80;
    listen [::]:80;
    server_name chainers.art www.chainers.art;
    location /.well-known/acme-challenge/ { root /var/www/chainers-art-acme; }
    location / {
        # visitors on http get sent to https; requests Cloudflare already received over https
        # (only happens in "Flexible" SSL mode) are served, so there is never a redirect loop
        if ($http_x_forwarded_proto != "https") { return 301 https://chainers.art$request_uri; }
        proxy_pass http://127.0.0.1:4190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chainers.art www.chainers.art;

    # symlinks to the Let's Encrypt live files (or a self-signed fallback, see chainers-art-renew-cert)
    ssl_certificate /etc/nginx/ssl/chainers-art/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/chainers-art/privkey.pem;
    ssl_session_cache shared:ChainersArtSSL:1m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/chainers-art-cloudflare-realip.conf;
    access_log off;
    error_log /var/log/nginx/chainers-art-error.log warn;
    client_max_body_size 16k;

    location /.well-known/acme-challenge/ { root /var/www/chainers-art-acme; }

    location / {
        if ($host = www.chainers.art) { return 301 https://chainers.art$request_uri; }
        proxy_pass http://127.0.0.1:4190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
