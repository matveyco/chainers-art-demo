# Static server for chainers.art. Runs inside the container (see compose.yml); the host nginx
# terminates TLS and proxies here. Serves ./site read-only.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;          # relative redirects, we sit behind a proxy

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml model/gltf-binary text/plain;

    error_page 404 /404.html;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # versioned paths: engine and fonts never change under the same URL
    location ^~ /vendor/ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ^~ /assets/fonts/ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # demo bundles carry a content hash in the file name
    location ~ "^/demos/[^/]+/(app|style)\.[0-9a-f]{10}\.(js|css)$" {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # demo assets are requested with ?v=<content hash>
    location ~ ^/demos/[^/]+/assets/ {
        types { model/gltf-binary glb; application/json json; image/png png; image/jpeg jpg; image/webp webp; }
        default_type application/octet-stream;
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:jpg|jpeg|png|webp|svg|ico)$ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # pages: always revalidate so a deploy shows up at once. No try_files on purpose: the static
    # module then redirects /demos/x to /demos/x/, so relative URLs inside a demo keep working.
    location / {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
